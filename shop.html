<!doctype html><html lang="en"><meta charset="utf-8"><title>Test shop</title><style>body{font:18px system-ui;max-width:700px;margin:50px auto}label,input,button{display:block;margin:10px 0}button{padding:12px}section[hidden]{display:none}</style><h1>Test shop</h1><p role="alert"></p><p role="status"></p><section id="login"><label>Username<input id="username"></label><label>Password<input id="password" type="password"></label><button id="sign">Login</button></section><section id="catalog" hidden><h2>Products</h2><article>Backpack $29.99<button id="add">Add to cart</button></article><button id="cart">Cart</button></section><section id="checkout" hidden><h2>Checkout</h2><p id="count"></p><label>Full name<input id="name"></label><button id="order">Place order</button></section><script>let quantity=0;const alert=document.querySelector('[role=alert]'),status=document.querySelector('[role=status]');document.querySelector('#sign').onclick=()=>{if(username.value==='standard_user'&&password.value==='secret_sauce'){document.querySelector('#login').hidden=true;catalog.hidden=false;alert.textContent=''}else alert.textContent='Invalid credentials'};add.onclick=()=>{quantity++;status.textContent='Added to cart'};cart.onclick=()=>{catalog.hidden=true;checkout.hidden=false;count.textContent=quantity+' item(s)'};order.onclick=()=>{if(!document.querySelector('#name').value.trim())alert.textContent='Name is required';else if(!quantity)alert.textContent='Cart is empty';else{alert.textContent='';status.textContent='Thank you for your order';checkout.hidden=true}};</script></html>
